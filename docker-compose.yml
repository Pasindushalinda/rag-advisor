services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: rag-qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  langfuse-db:
    image: postgres:16-alpine
    container_name: rag-langfuse-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: rag-langfuse
    restart: always
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-nextauth-secret
      SALT: change-me-salt
      TELEMETRY_ENABLED: "false"

  aegra-db:
    image: postgres:18-alpine
    container_name: rag-aegra-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aegra_db_data:/var/lib/postgresql

  aegra-redis:
    image: redis:7-alpine
    container_name: rag-aegra-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LANGFUSE_HOST: http://langfuse:3000
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: aegra-db
      POSTGRES_PORT: "5432"
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://aegra-redis:6379/0
    ports:
      - "127.0.0.1:2024:8000"
    depends_on:
      aegra-db:
        condition: service_healthy
      aegra-redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      langfuse:
        condition: service_started

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    container_name: rag-open-webui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      # signup is off, so the first admin must be seeded; only applies while no users exist
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?set WEBUI_ADMIN_EMAIL in .env}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?set WEBUI_ADMIN_PASSWORD in .env}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Admin}
      ENABLE_OLLAMA_API: "false"
      # sends X-OpenWebUI-User-Id/Chat-Id so the backend can attribute traces to users
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: pending
      # env wins over settings saved in the UI, so the lockdown below cannot be undone there
      ENABLE_PERSISTENT_CONFIG: "false"
      # background title/tag/follow-up calls would each hit the advisor graph and the LLM
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      # keep answers grounded in the filings pipeline only
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_COMMUNITY_SHARING: "false"
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "127.0.0.1:3002:8080"
    depends_on:
      - api

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  langfuse_db_data:
  aegra_db_data:
  open_webui_data: