services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: rag-qdrant
    # api uses the central Azure Qdrant/Langfuse (QDRANT_URL / LANGFUSE_HOST in backend/.env); local copies are opt-in
    profiles: ["local"]
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  langfuse-db:
    image: postgres:16-alpine
    container_name: rag-langfuse-db
    profiles: ["local"]
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    container_name: rag-langfuse
    profiles: ["local"]
    restart: always
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-nextauth-secret
      SALT: change-me-salt
      TELEMETRY_ENABLED: "false"

  aegra-db:
    image: postgres:18-alpine
    container_name: rag-aegra-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aegra_db_data:/var/lib/postgresql

  aegra-redis:
    image: redis:7-alpine
    container_name: rag-aegra-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # local runs only: trusts the Zscaler CA in certs/; set INSTALL_CA_CERTS=false when not behind Zscaler
        INSTALL_CA_CERTS: ${INSTALL_CA_CERTS:-true}
      additional_contexts:
        certs: ./certs
    container_name: rag-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: aegra-db
      POSTGRES_PORT: "5432"
      REDIS_BROKER_ENABLED: "true"
      REDIS_URL: redis://aegra-redis:6379/0
    ports:
      - "127.0.0.1:2024:8000"
    depends_on:
      aegra-db:
        condition: service_healthy
      aegra-redis:
        condition: service_healthy

  agent-chat-ui:
    build:
      context: ./chat-ui
      args:
        # local runs only: trusts the Zscaler CA in certs/; set INSTALL_CA_CERTS=false when not behind Zscaler
        INSTALL_CA_CERTS: ${INSTALL_CA_CERTS:-true}
      additional_contexts:
        certs: ./certs
    container_name: rag-agent-chat-ui
    restart: unless-stopped
    # No server-side key: the UI shows its setup form and the user pastes the API key, which the browser
    # sends straight to Aegra (CORS allows this origin in backend/aegra.json). Aegra validates the key.
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - api

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  langfuse_db_data:
  aegra_db_data:
