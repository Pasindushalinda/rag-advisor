[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pasindurathnayake", email = "pshalinda5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aegra-cli>=0.11.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=2.60,<3",
    "langgraph>=1.2.18",
    "lxml>=6.1.3",
    "openai>=3.41.0",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "ragas>=0.3.1",
    "uvicorn>=0.34.0",
    "yfinance>=1.7.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
    "mypy>=2.4.1",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.3",
]
