<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f3" />
    <title>Investor Advisor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        color: #182622;
        background: #f4f6f3;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --ink: #182622;
        --muted: #64736d;
        --line: #dce4df;
        --green: #176b52;
        --green-dark: #10513f;
        --surface: #ffffff;
        --soft: #eaf1ed;
        --warning: #9c3e32;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      button, textarea { font: inherit; }
      button { cursor: pointer; }

      .shell { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 650; }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: white;
        background: var(--green);
        font-size: 16px;
      }
      .header-actions { display: flex; align-items: center; gap: 16px; }
      .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #36946e; }
      .new-chat {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 11px;
        color: var(--ink);
        background: white;
        font-size: 13px;
      }
      .new-chat:hover { background: var(--soft); }

      main { width: min(920px, 100%); margin: 0 auto; padding: 42px 28px 24px; display: flex; flex-direction: column; min-height: 0; }
      .intro { margin-bottom: 27px; animation: appear 350ms ease-out both; }
      h1 { margin: 0 0 8px; font-size: 26px; font-weight: 640; letter-spacing: 0; }
      .intro p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
      .conversation { flex: 1; min-height: 240px; overflow-y: auto; padding: 4px 2px 24px; }
      .empty { max-width: 620px; padding: 36px 0 0; animation: appear 420ms ease-out both; }
      .empty-label { margin-bottom: 15px; color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; }
      .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .suggestion {
        min-height: 56px;
        text-align: left;
        padding: 12px 14px;
        color: #34443e;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: 13px;
        line-height: 1.4;
        transition: border-color 120ms ease, transform 120ms ease;
      }
      .suggestion:hover { border-color: #88ae9b; transform: translateY(-1px); }
      .message { display: flex; gap: 12px; margin: 18px 0; animation: appear 180ms ease-out both; }
      .message.user { justify-content: flex-end; }
      .avatar { flex: 0 0 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--green-dark);
        background: #dcebe3; font-size: 12px; font-weight: 700; }
      .bubble { max-width: min(720px, 84%); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.65; }
      .assistant .bubble { padding-top: 3px; }
      .user .bubble { padding: 10px 14px; border-radius: 12px 12px 3px 12px; background: #e5eee9; }
      .sources { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }
      .sources-title { margin-bottom: 3px; color: var(--ink); font-weight: 650; }
      .graph-activity {
        width: min(680px, calc(100% - 42px));
        margin: 14px 0 18px 42px;
        padding: 12px 14px;
        border-left: 2px solid #78a68e;
        background: #edf3ef;
        animation: appear 180ms ease-out both;
      }
      .activity-heading { display: flex; justify-content: space-between; gap: 12px; color: var(--ink); font-size: 12px; font-weight: 650; }
      .activity-status { color: var(--muted); font-weight: 450; }
      .activity-steps { display: grid; gap: 10px; margin: 10px 0 0; padding: 0; list-style: none; }
      .activity-step { display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 9px; align-items: start; color: #34443e; font-size: 12px; line-height: 1.5; }
      .activity-step::before { content: ""; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: #4c8b6d; }
      .activity-detail { margin-top: 2px; color: var(--muted); font-weight: 400; overflow-wrap: anywhere; }
      .error { margin: 8px 0 12px; color: var(--warning); font-size: 13px; }
      .composer { padding-top: 12px; border-top: 1px solid var(--line); }
      .compose-box { display: flex; align-items: flex-end; gap: 10px; padding: 9px; background: white; border: 1px solid #cbd7d0;
        border-radius: 8px; box-shadow: 0 3px 12px #203c3010; }
      textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; border: 0; outline: 0; padding: 10px 8px; color: var(--ink);
        background: transparent; font-size: 14px; line-height: 1.5; }
      textarea::placeholder { color: #89968f; }
      .send {
        display: grid;
        place-items: center;
        flex: 0 0 38px;
        height: 38px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: var(--green);
      }
      .send:hover:not(:disabled) { background: var(--green-dark); }
      .send:disabled { cursor: wait; opacity: .55; }
      .send svg { width: 17px; height: 17px; }
      .footnote { margin: 9px 2px 0; color: #7d8983; font-size: 11px; }
      .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
      .typing i { width: 6px; height: 6px; border-radius: 50%; background: #7b9185; animation: pulse 900ms ease-in-out infinite; }
      .typing i:nth-child(2) { animation-delay: 120ms; }
      .typing i:nth-child(3) { animation-delay: 240ms; }
      @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

      @media (max-width: 600px) {
        header { height: 58px; padding: 0 15px; }
        .header-actions { gap: 9px; }
        .status { font-size: 0; gap: 0; }
        .status-dot { width: 9px; height: 9px; }
        .new-chat { padding: 8px; font-size: 12px; }
        main { padding: 28px 16px 16px; }
        h1 { font-size: 22px; }
        .suggestions { grid-template-columns: 1fr; }
        .suggestion { min-height: 48px; }
        .conversation { min-height: 180px; }
        .bubble { max-width: 90%; }
        .graph-activity { width: calc(100% - 40px); margin-left: 40px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">I</span><span>Investor Advisor</span></div>
        <div class="header-actions">
          <span class="status" id="status"><span class="status-dot"></span> Connecting</span>
          <button class="new-chat" id="new-chat" type="button" title="Start a new conversation">
            <span aria-hidden="true">+</span> New chat
          </button>
        </div>
      </header>
      <main>
        <section class="intro">
          <h1>Research public companies</h1>
          <p>Ask questions about company filings. Answers use retrieved SEC filing excerpts and include source references when available.</p>
        </section>
        <section class="conversation" id="conversation" aria-live="polite" aria-label="Conversation">
          <div class="empty" id="empty">
            <div class="empty-label">Try asking</div>
            <div class="suggestions">
              <button class="suggestion" type="button">What are the company's main risk factors?</button>
              <button class="suggestion" type="button">Summarize the latest quarterly results.</button>
              <button class="suggestion" type="button">How has management described its growth strategy?</button>
              <button class="suggestion" type="button">Compare revenue by segment in the latest filing.</button>
            </div>
          </div>
        </section>
        <div class="error" id="error" role="alert" hidden></div>
        <form class="composer" id="composer">
          <div class="compose-box">
            <textarea id="question" rows="1" placeholder="Ask about a company or its filings..." aria-label="Your question" required></textarea>
            <button class="send" id="send" type="submit" title="Send message" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
            </button>
          </div>
          <div class="footnote">Responses may be incomplete. Verify important information against the cited filing.</div>
        </form>
      </main>
    </div>
    <script>
      const API = "/api";
      const MODEL = "investor-advisor";
      const HISTORY_KEY = "investor-advisor-history";
      const conversation = document.querySelector("#conversation");
      const empty = document.querySelector("#empty");
      const form = document.querySelector("#composer");
      const question = document.querySelector("#question");
      const send = document.querySelector("#send");
      const errorBox = document.querySelector("#error");
      const status = document.querySelector("#status");
      // The API is stateless (OpenAI-compatible), so the conversation lives in the browser.
      let history = JSON.parse(sessionStorage.getItem(HISTORY_KEY) || "[]");
      const saveHistory = () => sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history));

      function showStatus(text, connected = false) {
        status.innerHTML = `<span class="status-dot" style="background:${connected ? "#36946e" : "#d39739"}"></span> ${text}`;
      }

      function addMessage(role, text, citations = []) {
        empty.hidden = true;
        const row = document.createElement("div");
        row.className = `message ${role}`;
        if (role === "assistant") {
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = "IA";
          row.append(avatar);
        }
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        row.append(bubble);
        if (role === "assistant" && citations.length) {
          const list = document.createElement("div");
          list.className = "sources";
          const title = document.createElement("div");
          title.className = "sources-title";
          title.textContent = "Sources";
          list.append(title);
          citations.forEach((citation) => {
            const item = document.createElement("div");
            item.textContent = `[${citation.ref}] ${citation.label} · chunk ${citation.chunk_num}`;
            list.append(item);
          });
          bubble.append(list);
        }
        conversation.append(row);
        conversation.scrollTop = conversation.scrollHeight;
      }

      function showGraphActivity() {
        const panel = document.createElement("section");
        panel.className = "graph-activity";
        panel.setAttribute("aria-live", "polite");
        panel.setAttribute("aria-label", "Graph activity");
        const heading = document.createElement("div");
        heading.className = "activity-heading";
        const title = document.createElement("span");
        title.textContent = "Graph activity";
        const state = document.createElement("span");
        state.className = "activity-status";
        state.textContent = "Running";
        heading.append(title, state);
        const steps = document.createElement("ol");
        steps.className = "activity-steps";
        panel.append(heading, steps);
        conversation.append(panel);
        addActivityStep(steps, "Starting graph", "Waiting for the first node update.");
        conversation.scrollTop = conversation.scrollHeight;
        return { panel, state, steps };
      }

      function addActivityStep(steps, title, detail) {
        const item = document.createElement("li");
        item.className = "activity-step";
        const content = document.createElement("div");
        const label = document.createElement("div");
        label.textContent = title;
        content.append(label);
        if (detail) {
          const description = document.createElement("div");
          description.className = "activity-detail";
          description.textContent = detail;
          content.append(description);
        }
        item.append(content);
        steps.append(item);
        conversation.scrollTop = conversation.scrollHeight;
      }

      async function streamRun(messages, onReasoning, onContent) {
        const response = await fetch(`${API}/v1/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
          body: JSON.stringify({ model: MODEL, messages, stream: true }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.detail || body.message || body.error?.message || `Request failed (${response.status})`);
        }
        if (!response.body) throw new Error("The response stream is unavailable.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const handleEvent = (block) => {
          const data = block
            .split(/\r?\n/)
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trimStart())
            .join("\n");
          if (!data || data === "[DONE]") return;
          const delta = JSON.parse(data).choices?.[0]?.delta || {};
          if (delta.reasoning_content) onReasoning(delta.reasoning_content);
          if (delta.content) onContent(delta.content);
        };

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (value) buffer += decoder.decode(value, { stream: !done });
            let boundary;
            while ((boundary = /\r?\n\r?\n/.exec(buffer)) !== null) {
              handleEvent(buffer.slice(0, boundary.index));
              buffer = buffer.slice(boundary.index + boundary[0].length);
            }
            if (done) {
              if (buffer.trim()) handleEvent(buffer);
              break;
            }
          }
        } finally {
          reader.releaseLock();
        }
      }

      function restoreHistory() {
        history.forEach((message) => addMessage(message.role, message.content));
      }

      async function checkConnection() {
        const response = await fetch(`${API}/v1/models`);
        if (!response.ok) throw new Error(`Could not connect to the API (${response.status}).`);
      }

      async function submitQuestion(text) {
        const prompt = text.trim();
        if (!prompt || send.disabled) return;
        errorBox.hidden = true;
        addMessage("user", prompt);
        question.value = "";
        question.style.height = "auto";
        send.disabled = true;
        const activity = showGraphActivity();
        let answer = "";
        try {
          await streamRun(
            [...history, { role: "user", content: prompt }],
            (text) => addActivityStep(activity.steps, text.trim()),
            (text) => { answer += text; },
          );
          activity.state.textContent = "Complete";
          addMessage("assistant", answer || "The graph completed without a text answer.");
          history.push({ role: "user", content: prompt }, { role: "assistant", content: answer });
          saveHistory();
          window.setTimeout(() => activity.panel.remove(), 1800);
          showStatus("Graph connected", true);
        } catch (error) {
          activity.panel.remove();
          errorBox.textContent = error.message || "The graph request failed.";
          errorBox.hidden = false;
          showStatus("Request failed");
        } finally {
          send.disabled = false;
          question.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        submitQuestion(question.value);
      });
      question.addEventListener("input", () => {
        question.style.height = "auto";
        question.style.height = `${Math.min(question.scrollHeight, 160)}px`;
      });
      question.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => submitQuestion(button.textContent));
      });
      document.querySelector("#new-chat").addEventListener("click", () => {
        history = [];
        saveHistory();
        conversation.querySelectorAll(".message").forEach((message) => message.remove());
        conversation.querySelectorAll(".graph-activity").forEach((panel) => panel.remove());
        empty.hidden = false;
        errorBox.hidden = true;
      });

      restoreHistory();
      checkConnection()
        .then(() => showStatus("Graph connected", true))
        .catch((error) => {
          showStatus("Graph unavailable");
          errorBox.textContent = error.message || "Could not connect to the graph.";
          errorBox.hidden = false;
        });
    </script>
  </body>
</html>
